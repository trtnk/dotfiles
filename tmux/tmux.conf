# ==========================================
# 基本設定 (Basic Settings)
# ==========================================

# Neovim (LazyVim) のための True Color (24bit) 対応
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Prefixキーを Ctrl-Space に変更
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ウィンドウとペインの番号を1から始める
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# マウス操作を有効化
set -g mouse on

# クリップボード: OSC 52 を外側のターミナルへ通す（SSH 先からも手元にコピーできる）
set -s set-clipboard on
set -as terminal-features ",xterm-256color:clipboard:hyperlinks"
set -as terminal-features ",tmux-256color:clipboard:hyperlinks"

# ==========================================
# キーバインド (Key Bindings)
# ==========================================

# 設定ファイルの再読み込み (Prefix + r)
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded!"

# ペインの分割
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# 💡 ペインの移動 (Vimバインド)
# Prefix を押した後に h/j/k/l で移動
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# コピーモードのVim化
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind-key a next-window -a

# 自作ポップアップ（~/.local/bin）
bind-key i display-popup -E -w 70% -h 3 "~/.local/bin/inbox"
bind-key m display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "~/.local/bin/mdview"
bind-key M display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "~/.local/bin/mdview -t"
bind-key g display-popup -E -w 80% -h 60% "~/.local/bin/how"
bind-key y display-popup -E -w 95% -h 90% "~/.local/bin/approvals"
bind-key v display-popup -E -w 90% -h 40% -d "#{pane_current_path}" "~/.local/bin/vsopen"

# WSL のときだけ: 今のフォルダを Windows のエクスプローラで開く
if-shell 'grep -qi microsoft /proc/version' \
  'bind-key e run-shell -b "cd \"#{pane_current_path}\" && /mnt/c/Windows/explorer.exe . ; true"'

# ==========================================
# 入れ子の tmux（手元の tmux から SSH 先の tmux へ）
# ==========================================
# F12 で手元の tmux を眠らせ、キーを全部 SSH 先へ素通しする。もう一度 F12 で戻る。
# 眠っている間は手元のステータスバーに [OFF] が出る。
bind -T root F12 \
  set prefix None \; set key-table off \; set status-style "fg=colour245,bg=colour238" \; \
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \; refresh-client -S
bind -T off F12 \
  set -u prefix \; set -u key-table \; set -u status-style \; refresh-client -S

# ==========================================
# ステータスバー・ベル
# ==========================================
set -g monitor-bell on
set -g bell-action any
set -g visual-bell off
set -g window-status-bell-style 'fg=white,bg=red,bold'
set -g status-interval 5
set -g status-right-length 80
# SSH 先ではホスト名を出す（手元と見分ける）。~/.cache/claude-usage はあれば出る。承認待ちがあれば件数を出す
set -g status-right '#{?#{==:#{client_key_table},off},[OFF] ,}#(~/.local/bin/approvals --count)#(test -n "$SSH_CONNECTION" && hostname -s | sed "s/$/ | /")#(cat ~/.cache/claude-usage 2>/dev/null) | %H:%M'

# ==========================================
# プラグイン設定 (TPM)
# ==========================================
set -g @plugin 'tmux-plugins/tpm'

# セッション保存・復元プラグイン
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# continuumの設定：tmux起動時にセッションを自動復元する
set -g @continuum-restore 'on'

# tmuxとNeovimのシームレスな窓移動
set -g @plugin 'christoomey/vim-tmux-navigator'

# マシンごとの追記（git に入れない）
if-shell 'test -f ~/.tmux.local.conf' 'source-file ~/.tmux.local.conf'

# プラグインマネージャーの初期化 (必ずファイルの最後に書くこと)
run '~/.tmux/plugins/tpm/tpm'
